# Build and deploy Road Ready to Cloud Run.
# Usage (from repo root, after gcloud is logged in):
#   gcloud builds submit --config=cloudbuild.yaml \
#     --substitutions=_REGION=europe-west1,_SERVICE=road-ready,_GA_ID=,_GSC_TOKEN=
#
# Runtime secrets (DATABASE_URL, FIREBASE_*, ADMIN_EMAILS, …) are set on the
# Cloud Run service — not in this file. See scripts/deploy-cloudrun.sh.
# Use $BUILD_ID for image tags (works with manual gcloud builds submit;
# $SHORT_SHA is empty unless the build is triggered from a connected repo).

substitutions:
  _REGION: europe-west1
  _SERVICE: road-ready
  _SITE_URL: https://rr.kyzed.com
  _GA_ID: ""
  _GSC_TOKEN: ""

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/road-ready/${_SERVICE}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/road-ready/${_SERVICE}:latest
      - --build-arg
      - VITE_SITE_URL=${_SITE_URL}
      - --build-arg
      - VITE_GA_MEASUREMENT_ID=${_GA_ID}
      - --build-arg
      - VITE_GSC_VERIFICATION=${_GSC_TOKEN}
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/road-ready/${_SERVICE}:$BUILD_ID

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/road-ready/${_SERVICE}:latest

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/road-ready/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8000
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=3
      - --update-env-vars=FRONTEND_URL=${_SITE_URL}

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/road-ready/${_SERVICE}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/road-ready/${_SERVICE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
