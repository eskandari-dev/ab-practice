services:
  - type: web
    name: ab-practice
    # one container: the React site plus the API under /api (see Dockerfile and backend/server.py)
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    # the free plan has no disk, so users are kept in Postgres (DATABASE_URL, for example from neon.tech)
    plan: free
    healthCheckPath: /api/config
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        value: https://ab-practice.onrender.com
      - key: SUPPORT_EMAIL
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
