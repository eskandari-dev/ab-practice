services:
  - type: web
    name: ab-practice
    # one container: the React site plus the API under /api (see Dockerfile and backend/server.py)
    runtime: docker
    dockerfilePath: ./Dockerfile
    # a persistent disk needs a paid plan; on the free plan the SQLite database is wiped on every deploy
    plan: starter
    healthCheckPath: /api/config
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /data/app.db
      - key: FRONTEND_URL
        value: https://quiz.kyzed.com
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
