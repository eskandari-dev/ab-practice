name: Keep awake

# Render's free plan sleeps after 15 minutes without visitors, and the first visit then waits about a minute
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl --silent --show-error --max-time 120 --retry 2 https://ab-practice.onrender.com/api/config > /dev/null
